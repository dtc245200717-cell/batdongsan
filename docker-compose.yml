x-secure: &secure
  security_opt:
    - no-new-privileges:true

services:
  app:
    <<: *secure
    build: ./docker/php
    restart: unless-stopped
    user: "1000:1000"
    cap_drop: [ALL]
    volumes:
      - ./src:/var/www/html
    networks: [backend]
    depends_on:
      - mysql

  nginx:
    <<: *secure
    image: nginxinc/nginx-unprivileged:stable
    restart: unless-stopped
    cap_drop: [ALL]
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    networks: [frontend, backend]
    depends_on:
      - app
      - phpmyadmin

  mysql:
    <<: *secure
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: batdongsan
      MYSQL_USER: bds_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [backend]

  phpmyadmin:
    <<: *secure
    image: phpmyadmin:latest
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_ABSOLUTE_URI: https://192.168.98.129/pma/
    networks: [backend]
    depends_on:
      - mysql

  prometheus:
    <<: *secure
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [monitoring]

  grafana:
    <<: *secure
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [monitoring]
    depends_on:
      - prometheus

  node-exporter:
    <<: *secure
    image: prom/node-exporter:latest
    restart: unless-stopped
    pid: host
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro,rslave
    networks: [monitoring]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [monitoring]

  mysqld-exporter:
    <<: *secure
    image: prom/mysqld-exporter:latest
    restart: unless-stopped
    command:
      - "--config.my-cnf=/etc/mysqld-exporter/.my.cnf"
    volumes:
      - ./docker/mysqld-exporter/.my.cnf:/etc/mysqld-exporter/.my.cnf:ro
    networks: [backend, monitoring]
    depends_on:
      - mysql

  nginx-exporter:
    <<: *secure
    image: nginx/nginx-prometheus-exporter:latest
    restart: unless-stopped
    command:
      - "--nginx.scrape-uri=http://nginx:8081/stub_status"
    networks: [backend, monitoring]
    depends_on:
      - nginx

  loki:
    <<: *secure
    image: grafana/loki:3.5.0
    restart: unless-stopped
    volumes:
      - loki_data:/loki
    networks: [monitoring]

  promtail:
    image: grafana/promtail:3.5.0
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./docker/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [monitoring]
    depends_on:
      - loki

networks:
  frontend:
  backend:
    internal: true
  monitoring:

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
  loki_data:
